<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Europeo de Alimentos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        .buscador { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        input { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #resultados { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .tarjeta { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .tarjeta img { max-width: 100px; height: 100px; object-fit: contain; }
        .nutriscore { font-weight: bold; text-transform: uppercase; padding: 5px; border-radius: 4px; display: inline-block; margin-top: 10px; background: #eee; }
    </style>
</head>
<body>

    <h1>Catálogo Europeo de Alimentos</h1>
    
    <div class="buscador">
        <input type="text" id="inputBusqueda" placeholder="Ej. Aceite de oliva, leche, avena...">
        <button onclick="buscarAlimentos()">Buscar</button>
    </div>

    <div id="resultados"></div>

    <script>
        async function buscarAlimentos() {
            const termino = document.getElementById('inputBusqueda').value;
            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '<p style="text-align:center; width:100%;">Buscando en la base de datos europea...</p>';

            // Consulta a la API de Open Food Facts filtrando resultados en español/europeos
            const url = `https://es.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(termino)}&search_simple=1&action=process&json=1&page_size=12`;

            try {
                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                contenedor.innerHTML = '';

                if (datos.products.length === 0) {
                    contenedor.innerHTML = '<p>No se encontraron alimentos.</p>';
                    return;
                }

                datos.products.forEach(producto => {
                    const nombre = producto.product_name || 'Nombre no disponible';
                    const imagen = producto.image_front_small_url || 'https://via.placeholder.com/100?text=Sin+Imagen';
                    const nutriscore = producto.nutriscore_grade ? producto.nutriscore_grade : 'N/A';
                    const kcal = producto.nutriments['energy-kcal_100g'] ? `${producto.nutriments['energy-kcal_100g']} kcal / 100g` : 'Calorías no especificadas';

                    const tarjeta = `
                        <div class="tarjeta">
                            <img src="${imagen}" alt="${nombre}">
                            <h3>${nombre}</h3>
                            <p>${kcal}</p>
                            <span class="nutriscore">Nutri-Score: ${nutriscore}</span>
                        </div>
                    `;
                    contenedor.innerHTML += tarjeta;
                });
            } catch (error) {
                contenedor.innerHTML = '<p>Error al cargar los datos.</p>';
                console.error(error);
            }
        }
    </script>
</body>
</html>
